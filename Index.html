<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Points Reckoner</title>
  <style>
    :root {
      --bg-color: #f1f8e9;         /* Light green page background */
      --card-bg: #ffffff;          /* White card container */
      --primary-green: #2e7d32;    /* Dark forest green for headers & buttons */
      --accent-green: #81c784;     /* Medium light green */
      --border-green: #c8e6c9;     /* Soft border green */
      --chip-active: #388e3c;
      --chip-inactive: #e8f5e9;
      --text-dark: #1b5e20;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 18px;
      color: #263238;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 4px 15px rgba(46, 125, 50, 0.12);
      border: 1px solid var(--border-green);
    }

    header {
      border-bottom: 2px solid var(--border-green);
      padding-bottom: 12px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
      color: var(--primary-green);
      font-size: 20px;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      margin-bottom: 16px;
      background-color: #f9fbf9;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid var(--border-green);
    }

    .form-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-weight: 600;
      color: var(--text-dark);
      font-size: 14px;
    }

    select {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1.5px solid var(--accent-green);
      font-size: 14px;
      background-color: #fff;
      color: #263238;
      cursor: pointer;
      outline: none;
      min-width: 170px;
    }

    select:focus {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.2);
    }

    .language-toggle {
      display: flex;
      gap: 8px;
    }

    .lang-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid var(--accent-green);
      background-color: var(--chip-inactive);
      color: var(--text-dark);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background-color: var(--chip-active);
      color: #ffffff;
      border-color: var(--chip-active);
      box-shadow: 0 2px 6px rgba(46, 125, 50, 0.25);
    }

    .open-btn {
      margin-left: auto;
      text-decoration: none;
      background-color: var(--primary-green);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }

    .open-btn:hover {
      background-color: #1b5e20;
    }

    .viewer-panel {
      position: relative;
      width: 100%;
      height: 540px;
      border-radius: 8px;
      border: 1.5px solid var(--border-green);
      overflow: hidden;
      background-color: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .placeholder-msg {
      text-align: center;
      color: #4b6b4e;
      font-size: 15px;
    }

    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(46, 125, 50, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary-green);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h2>Question Points Reckoner</h2>
      <a id="externalLink" class="open-btn" href="#" target="_blank" style="display:none;">
        Open in New Tab ↗
      </a>
    </header>

    <div class="controls-row">
      <!-- Question Dropdown -->
      <div class="form-group">
        <label for="questionSelect">Select Question:</label>
        <select id="questionSelect" onchange="renderFile()">
          <option value="">Loading questions...</option>
        </select>
      </div>

      <!-- Language Selection (English / Malayalam) -->
      <div class="form-group">
        <label>Language:</label>
        <div class="language-toggle">
          <button type="button" id="btnEnglish" class="lang-btn active" onclick="setLanguage('English')">English</button>
          <button type="button" id="btnMalayalam" class="lang-btn" onclick="setLanguage('Malayalam')">Malayalam</button>
        </div>
      </div>
    </div>

    <!-- Viewer Panel -->
    <div class="viewer-panel" id="viewerContainer">
      <div class="placeholder-msg" id="placeholder">
        <div class="spinner"></div>
        <div>Loading Reckoner data...</div>
      </div>
    </div>
  </div>

  <script>
    let questionsData = [];
    let currentLanguage = 'English';

    // Fetch data from Apps Script backend on page load
    window.onload = function() {
      google.script.run
        .withSuccessHandler(populateQuestions)
        .withFailureHandler(handleError)
        .getSheetData();
    };

    function populateQuestions(data) {
      questionsData = data;
      const select = document.getElementById('questionSelect');
      select.innerHTML = '';

      if (data.length === 0) {
        select.innerHTML = '<option value="">No questions found</option>';
        document.getElementById('placeholder').innerHTML = 'No question links found in Sheet1.';
        return;
      }

      data.forEach((item, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = 'Question ' + item.question;
        select.appendChild(option);
      });

      renderFile();
    }

    function setLanguage(lang) {
      currentLanguage = lang;
      document.getElementById('btnEnglish').classList.toggle('active', lang === 'English');
      document.getElementById('btnMalayalam').classList.toggle('active', lang === 'Malayalam');
      renderFile();
    }

    function renderFile() {
      const select = document.getElementById('questionSelect');
      const selectedIndex = select.value;
      const viewer = document.getElementById('viewerContainer');
      const extLink = document.getElementById('externalLink');

      if (selectedIndex === '' || !questionsData[selectedIndex]) {
        viewer.innerHTML = '<div class="placeholder-msg">Select a question above to display the file.</div>';
        extLink.style.display = 'none';
        return;
      }

      const item = questionsData[selectedIndex];
      const targetUrl = (currentLanguage === 'English') ? item.englishUrl : item.malayalamUrl;

      if (!targetUrl) {
        viewer.innerHTML = `<div class="placeholder-msg">No ${currentLanguage} file link available for Question ${item.question}.</div>`;
        extLink.style.display = 'none';
        return;
      }

      extLink.href = targetUrl;
      extLink.style.display = 'inline-flex';

      // Embed Google Drive preview in an iframe
      viewer.innerHTML = `<iframe src="${targetUrl}" allow="autoplay"></iframe>`;
    }

    function handleError(error) {
      document.getElementById('placeholder').innerHTML = 
        '<span style="color:#c62828;">Error loading data: ' + error.message + '</span>';
    }
  </script>
</body>
</html>
